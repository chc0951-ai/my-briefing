<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>모닝 브리핑</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-50 bg-slate-900/85 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                <i class="fa-solid fa-bolt text-amber-400"></i> 오늘의 브리핑
            </h1>
            <p id="current-date" class="text-xs text-slate-400">날짜 불러오는 중...</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="refreshData()" class="p-2 text-slate-400 hover:text-white transition-colors" title="새로고침">
                <i id="refresh-icon" class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- 메인 대시보드 컨테이너 -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 1. 날씨 (인천 서해구) -->
        <section class="bg-gradient-to-br from-blue-900/60 to-slate-800 border border-blue-500/30 rounded-2xl p-4 shadow-lg">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <span class="text-xs font-medium bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full">인천 서해구</span>
                    <h2 id="weather-desc" class="text-2xl font-bold mt-1 text-white">불러오는 중...</h2>
                </div>
                <div class="text-right">
                    <span id="weather-temp" class="text-3xl font-extrabold text-white">--°</span>
                    <p class="text-xs text-slate-300">최고 <span id="weather-high">--°</span> / 최저 <span id="weather-low">--°</span></p>
                </div>
            </div>
            
            <!-- 시간대별 날씨 (가로 스크롤) -->
            <div class="mt-4 pt-3 border-t border-blue-500/20">
                <p class="text-xs font-semibold text-blue-200 mb-2">시간대별 날씨 (향후 12시간)</p>
                <div id="hourly-weather" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1 text-center">
                    <div class="text-xs text-slate-400">날씨 데이터를 불러오는 중...</div>
                </div>
            </div>
        </section>

        <!-- 2. 환율 및 지수 (2단 그리드) -->
        <div class="grid grid-cols-2 gap-3">
            <!-- 환율 카드 -->
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                        <span>원/달러 (USD)</span>
                        <i class="fa-solid fa-dollar-sign text-emerald-400"></i>
                    </div>
                    <div id="usd-rate" class="text-xl font-bold text-white">-- 원</div>
                    <p id="usd-change" class="text-[11px] text-slate-400 mt-0.5">업데이트 중...</p>
                </div>
                
                <div class="mt-3 pt-3 border-t border-slate-700/60">
                    <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                        <span>원/엔 (100 JPY)</span>
                        <i class="fa-solid fa-yen-sign text-amber-400"></i>
                    </div>
                    <div id="jpy-rate" class="text-lg font-bold text-white">-- 원</div>
                </div>
            </div>

            <!-- 증시 (코스피 / 코스닥) -->
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                        <span>KOSPI</span>
                        <span id="kospi-change-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300">--</span>
                    </div>
                    <div id="kospi-val" class="text-lg font-bold text-white">--</div>
                </div>
                <div class="mt-3 pt-3 border-t border-slate-700/60">
                    <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
                        <span>KOSDAQ</span>
                        <span id="kosdaq-change-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300">--</span>
                    </div>
                    <div id="kosdaq-val" class="text-lg font-bold text-white">--</div>
                </div>
            </div>
        </div>

        <!-- 3. 주식 관련 주요 이슈사항 -->
        <section class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line"></i> 주식 관련 주요 이슈
                </h3>
                <span class="text-[10px] text-slate-400 bg-slate-700 px-2 py-0.5 rounded-full">실시간 증시</span>
            </div>
            <ul id="stock-issues" class="space-y-2.5 text-xs text-slate-200">
                <li class="text-slate-400">증시 주요 이슈를 불러오는 중...</li>
            </ul>
        </section>

        <!-- 4. 주요 뉴스 5건 -->
        <section class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-blue-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-newspaper"></i> 주요 뉴스 5건
                </h3>
                <span class="text-[10px] text-slate-400">클릭 시 원문 이동</span>
            </div>
            <div id="news-list" class="space-y-3">
                <div class="text-xs text-slate-400 text-center py-2">최신 뉴스를 불러오는 중...</div>
            </div>
        </section>

    </main>

    <script>
        // 오늘 날짜 표시
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').innerText = now.toLocaleDateString('ko-KR', options);

        // 전체 데이터 새로고침
        async function refreshData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');
            
            await Promise.allSettled([
                fetchWeather(),
                fetchExchangeRates(),
                fetchStockIndices(),
                fetchStockIssues(),
                fetchTopNews()
            ]);

            setTimeout(() => {
                icon.classList.remove('fa-spin');
            }, 500);
        }

        // 1. 인천 서해구 날씨 (Open-Meteo API: 서해구청 인근 위도 37.545, 경도 126.676)
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.545&longitude=126.676&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul');
                const data = await res.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const maxTemp = Math.round(data.daily.temperature_2m_max[0]);
                const minTemp = Math.round(data.daily.temperature_2m_min[0]);
                const code = data.current.weather_code;

                document.getElementById('weather-temp').innerText = `${temp}°`;
                document.getElementById('weather-high').innerText = `${maxTemp}°`;
                document.getElementById('weather-low').innerText = `${minTemp}°`;
                document.getElementById('weather-desc').innerText = getWeatherText(code);

                // 시간대별 날씨 (현재 시간부터 12시간)
                const currentHourIdx = new Date().getHours();
                const hourlyContainer = document.getElementById('hourly-weather');
                hourlyContainer.innerHTML = '';

                for (let i = currentHourIdx; i < currentHourIdx + 12; i++) {
                    if (!data.hourly.time[i]) break;
                    const timeStr = data.hourly.time[i].slice(11, 16);
                    const hTemp = Math.round(data.hourly.temperature_2m[i]);
                    const hCode = data.hourly.weather_code[i];
                    const pop = data.hourly.precipitation_probability ? data.hourly.precipitation_probability[i] : 0;
                    
                    const div = document.createElement('div');
                    div.className = "flex flex-col items-center justify-center bg-slate-800/70 border border-slate-700/50 px-3 py-2 rounded-xl min-w-[64px]";
                    div.innerHTML = `
                        <span class="text-[11px] text-slate-400">${timeStr}</span>
                        <i class="${getWeatherIcon(hCode)} text-amber-300 my-1.5 text-sm"></i>
                        <span class="text-xs font-bold text-white">${hTemp}°</span>
                        <span class="text-[10px] text-blue-300 mt-0.5">${pop > 0 ? pop + '%' : '-'}</span>
                    `;
                    hourlyContainer.appendChild(div);
                }
            } catch (e) {
                document.getElementById('weather-desc').innerText = "날씨 조회 실패";
            }
        }

        function getWeatherText(code) {
            if (code === 0) return "맑음 ☀️";
            if (code <= 3) return "구름 조금 ⛅";
            if (code <= 48) return "안개 🌫️";
            if (code <= 67) return "비 🌧️";
            if (code <= 77) return "눈 ❄️";
            return "흐림 ☁️";
        }

        function getWeatherIcon(code) {
            if (code === 0) return "fa-solid fa-sun";
            if (code <= 3) return "fa-solid fa-cloud-sun";
            if (code <= 67) return "fa-solid fa-cloud-rain";
            if (code <= 77) return "fa-solid fa-snowflake";
            return "fa-solid fa-cloud";
        }

        // 2-1. 환율 데이터 (무료 공개 API)
        async function fetchExchangeRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                const krw = data.rates.KRW;
                const jpyPerUsd = data.rates.JPY;
                const jpyKrw = (krw / jpyPerUsd) * 100;

                document.getElementById('usd-rate').innerText = `${krw.toLocaleString('ko-KR', {maximumFractionDigits: 2})} 원`;
                document.getElementById('jpy-rate').innerText = `${jpyKrw.toFixed(2)} 원`;
                document.getElementById('usd-change').innerText = `기준: ${data.time_last_update_utc.slice(5, 16)} UTC`;
            } catch (e) {
                document.getElementById('usd-rate').innerText = "조회 실패";
            }
        }

        // 2-2. 코스피 / 코스닥 지수 (야후 파이낸스 CORS 프록시 활용)
        async function fetchStockIndices() {
            const symbols = [
                { id: 'kospi', symbol: '%5EKS11' },
                { id: 'kosdaq', symbol: '%5EKQ11' }
            ];

            for (const item of symbols) {
                try {
                    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${item.symbol}?interval=1d&range=2d`;
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    const res = await fetch(proxyUrl);
                    const wrapper = await res.json();
                    const data = JSON.parse(wrapper.contents);
                    
                    const meta = data.chart.result[0].meta;
                    const price = meta.regularMarketPrice;
                    const prevClose = meta.chartPreviousClose;
                    const diffPct = ((price - prevClose) / prevClose) * 100;

                    document.getElementById(`${item.id}-val`).innerText = price.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    
                    const badge = document.getElementById(`${item.id}-change-badge`);
                    const sign = diffPct >= 0 ? '+' : '';
                    badge.innerText = `${sign}${diffPct.toFixed(2)}%`;
                    
                    if (diffPct >= 0) {
                        badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-400 font-semibold";
                    } else {
                        badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-semibold";
                    }
                } catch (e) {
                    document.getElementById(`${item.id}-val`).innerText = "장마감/대기";
                }
            }
        }

        // RSS 파싱 공통 헬퍼 (API 키 없이 실시간 구글 뉴스 RSS 변환)
        async function fetchGoogleRss(query, limit = 5) {
            const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=ko&gl=KR&ceid=KR:ko`;
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            const res = await fetch(apiUrl);
            const data = await res.json();
            if (data.status === 'ok') {
                return data.items.slice(0, limit);
            }
            return [];
        }

        // 3. 주식 관련 주요 이슈 3건
        async function fetchStockIssues() {
            try {
                const items = await fetchGoogleRss('코스피 증시 특징주 시황', 3);
                const issueList = document.getElementById('stock-issues');
                
                if (items.length === 0) throw new Error('No items');

                issueList.innerHTML = items.map(item => {
                    const cleanTitle = item.title.split(' - ')[0];
                    return `
                        <li class="flex items-start gap-2">
                            <span class="text-amber-400 mt-0.5">•</span>
                            <a href="${item.link}" target="_blank" class="hover:text-amber-300 transition-colors leading-relaxed">
                                ${cleanTitle}
                            </a>
                        </li>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('stock-issues').innerHTML = `<li class="text-slate-400">증시 이슈를 불러오지 못했습니다. 새로고침을 눌러주세요.</li>`;
            }
        }

        // 4. 주요 뉴스 5건
        async function fetchTopNews() {
            try {
                const items = await fetchGoogleRss('한국 주요뉴스 경제 사회', 5);
                const newsList = document.getElementById('news-list');

                if (items.length === 0) throw new Error('No news');

                newsList.innerHTML = items.map(item => {
                    const parts = item.title.split(' - ');
                    const press = parts.length > 1 ? parts.pop() : '주요언론';
                    const title = parts.join(' - ');
                    const pubDate = new Date(item.pubDate);
                    const timeStr = `${pubDate.getHours().toString().padStart(2, '0')}:${pubDate.getMinutes().toString().padStart(2, '0')}`;

                    return `
                        <a href="${item.link}" target="_blank" class="block border-b border-slate-700/50 pb-2.5 last:border-0 last:pb-0 group">
                            <p class="text-xs font-medium text-slate-200 group-hover:text-blue-400 transition-colors leading-snug">
                                ${title}
                            </p>
                            <div class="flex justify-between items-center mt-1 text-[10px] text-slate-400">
                                <span class="text-slate-300 font-medium">${press}</span>
                                <span>${timeStr}</span>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('news-list').innerHTML = `<div class="text-xs text-slate-400 text-center">뉴스를 불러오지 못했습니다.</div>`;
            }
        }

        // 페이지 로드 시 자동 실행
        refreshData();
    </script>
</body>
</html>
